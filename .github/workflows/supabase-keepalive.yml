name: Supabase keep-alive
on:
  schedule:
    - cron: '17 16 * * 1,4'   # Mon & Thu 16:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Light REST read (returns 0 rows)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            "$SB_URL/rest/v1/entries?select=id&limit=0" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"
          test "$code" = 200
